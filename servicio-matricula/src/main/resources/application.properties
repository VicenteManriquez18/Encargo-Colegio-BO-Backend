spring.application.name=servicio-matricula

server.port=8083

# URL de conexión (El puerto por defecto de Postgres es 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/matricula_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Driver y Dialecto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gestión de tablas (Muy importante durante el desarrollo)
# 'update' creará las tablas automáticamente basándose en tu clase @Entity Usuario
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola para debugear
spring.jpa.show-sql=true

# Configuración de RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.jackson.default-property-inclusion=non_null

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/matricula/v3/api-docs
springdoc.swagger-ui.enabled=false

servicio.usuarios.url=${SERVICIO_USUARIOS_URL:http://127.0.0.1:8081}
servicio.academico.url=${SERVICIO_ACADEMICO_URL:http://127.0.0.1:8084}
