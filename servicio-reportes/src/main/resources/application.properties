spring.application.name=servicio-reportes

server.port=8085

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/reportes_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/reportes/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.proyecto.reportes=INFO
logging.level.org.springframework.amqp=DEBUG

# URLs de Servicios Externos
servicio.academico.url=http://127.0.0.1:8084
servicio.asistencia.url=http://127.0.0.1:8082
