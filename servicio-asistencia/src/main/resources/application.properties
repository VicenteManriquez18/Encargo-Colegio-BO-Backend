spring.application.name=servicio-asistencia
server.port=8082

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/asistencia_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/asistencia/v3/api-docs
springdoc.swagger-ui.enabled=false

servicio.usuarios.url=http://127.0.0.1:8081
servicio.matricula.url=http://127.0.0.1:8083
servicio.academico.url=http://127.0.0.1:8084
