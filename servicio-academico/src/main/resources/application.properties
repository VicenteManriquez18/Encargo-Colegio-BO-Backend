spring.application.name=servicio-academico

server.port=8084

# URL de conexión (El puerto por defecto de Postgres es 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/academico_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Driver y Dialecto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gestión de tablas
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola para debugear
spring.jpa.show-sql=true
